<body>
<div class="container" id="appContainer">
    <!-- Main app (rendered by JS) -->
</div>

<script type="module">
    import { ref, push, onValue, remove, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const wait = setInterval(() => {
        if (window._fb && window._fb.db) {
            clearInterval(wait);
            boot();
        }
    }, 100);

    let currentMode = 'url';
    let isShareView = false;
    let shareKey = null;

    function boot() {
        const params = new URLSearchParams(window.location.search);
        shareKey = params.get('embed');
        if (shareKey) {
            isShareView = true;
            renderShareView();
        } else {
            renderMainView();
            initMainApp();
        }
    }

    function renderMainView() {
        document.getElementById('appContainer').innerHTML = `
            <h1>JARVIS Embed Studio</h1>
            <p class="subtitle">Paste a link, or paste a full iframe/video/audio HTML block. Every saved embed gets its own shareable link.</p>

            <div class="mode-toggle">
                <button id="modeUrl" class="active" onclick="setMode('url')">🔗 Link</button>
                <button id="modeCode" onclick="setMode('code')">&lt;/&gt; HTML code</button>
            </div>

            <div class="input-row" id="rowUrl">
                <input id="urlInput" type="text" placeholder="Paste a YouTube, Vimeo, TikTok, MP4, MP3, PDF, or any link…">
            </div>
            <div class="input-row" id="rowCode" style="display:none;">
                <textarea id="codeInput" placeholder='Paste a full iframe, video, audio, or img HTML block.'></textarea>
            </div>

            <div class="hint">
                Tip: For TikTok, paste the full iframe code or a TikTok video link — the app converts it automatically. TikTok embeds are region-restricted and may fail in some locations.
            </div>

            <div class="input-row">
                <button class="btn" id="saveBtn" onclick="addLink()">Convert &amp; Save</button>
            </div>

            <div id="statusBox" class="status"></div>
            <div id="embedList"></div>

            <div class="footer-info">
                Built by Gesner Deslandes (GlobalInternet.py)<br>
                Phone: (509) 4738 5663 · Email: deslandes78@gmail.com<br>
                <a href="https://deslandes1.github.io/jarvis-auto-apply./" target="_blank">JARVIS Auto-Apply</a> ·
                <a href="https://deslandes1.github.io/G-COMMUNICATION-2026/" target="_blank">G JARVIS Portal</a> ·
                <a href="https://globalinternetsitepy-abh7v6tnmskxxnuplrdcgk.streamlit.app/" target="_blank">Global Technology Site</a>
            </div>
        `;
    }

    function renderShareView() {
        document.getElementById('appContainer').innerHTML = `
            <div class="share-page">
                <h1>Shared Embed</h1>
                <div class="share-banner">This embed was shared with you. Copy the code below to use it anywhere.</div>
                <div id="shareEmbedArea"></div>
                <div style="text-align:center;margin-top:20px;">
                    <a class="btn secondary" href="./" style="text-decoration:none;display:inline-block;">← Back to Embed Studio</a>
                </div>
            </div>
        `;
        loadSharedEmbed(shareKey);
    }

    async function loadSharedEmbed(key) {
        try {
            const snap = await get(ref(window._fb.db, 'embed_studio/links/' + key));
            const item = snap.val();
            const area = document.getElementById('shareEmbedArea');
            if (!item) {
                area.innerHTML = '<div class="empty-state"><div class="icon">🔍</div>This shared embed was not found. It may have been removed.</div>';
                return;
            }
            area.innerHTML = renderCard(item, key, true);
        } catch (e) {
            document.getElementById('shareEmbedArea').innerHTML = '<div class="empty-state"><div class="icon">⚠️</div>Could not load this embed. Check the link or try again later.</div>';
        }
    }

    function initMainApp() {
        const db = window._fb.db;
        const EMBEDS_PATH = 'embed_studio/links';
        const linksRef = ref(db, EMBEDS_PATH);

        window.setMode = function(mode) {
            currentMode = mode;
            document.getElementById('modeUrl').classList.toggle('active', mode === 'url');
            document.getElementById('modeCode').classList.toggle('active', mode === 'code');
            document.getElementById('rowUrl').style.display = mode === 'url' ? 'flex' : 'none';
            document.getElementById('rowCode').style.display = mode === 'code' ? 'flex' : 'none';
        };

        window.addLink = async function() {
            const btn = document.getElementById('saveBtn');
            let raw = currentMode === 'url'
                ? (document.getElementById('urlInput').value || '').trim()
                : (document.getElementById('codeInput').value || '').trim();

            if (!raw) return showStatus('Please paste a link or an HTML block first.', 'error');

            const info = analyzeInput(raw, currentMode);
            if (!info) return showStatus('Could not understand this input. Paste a https:// link or a full iframe/video/audio HTML block.', 'error');

            if (info.type === 'tiktok') {
                btn.disabled = true;
                btn.textContent = 'Checking TikTok…';
                const check = await validateTikTok(info.url);
                btn.disabled = false;
                btn.textContent = 'Convert & Save';
                if (!check.ok) {
                    showStatus('❌ This TikTok video cannot be embedded (' + check.reason + '). TikTok blocks its player in some regions. Try a direct MP4 link instead.', 'error');
                    return;
                }
                showStatus('TikTok video is embeddable — saving…', 'warning');
            }

            const newRef = push(linksRef);
            const key = newRef.key;

            const shareUrl = window.location.origin + window.location.pathname + '?embed=' + encodeURIComponent(key);

            newRef.set({
                url: info.url,
                type: info.type,
                embedUrl: info.embedUrl,
                embedCode: info.embedCode,
                title: info.title,
                shareUrl: shareUrl,
                createdAt: Date.now()
            }).then(() => {
                document.getElementById('urlInput').value = '';
                document.getElementById('codeInput').value = '';
                showStatus('Saved. Share link ready below.', 'success');
            }).catch(err => {
                const msg = (err && err.message) || 'unknown';
                if (msg.indexOf('PERMISSION_DENIED') !== -1) {
                    showStatus('Firebase denied the write. Confirm the Realtime Database exists in project datingapplication-25f32 and that `embed_studio` has `.read: true` and `.write: true` under Rules.', 'error');
                } else {
                    showStatus('Save failed: ' + msg, 'error');
                }
            });
        };

        onValue(linksRef, (snapshot) => {
            const data = snapshot.val() || {};
            const list = Object.keys(data)
                .map(k => ({ key: k, ...data[k] }))
                .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
            renderList(list);
        }, (err) => {
            const wrap = document.getElementById('embedList');
            if (wrap && !wrap.innerHTML.trim()) {
                wrap.innerHTML = '<div class="empty-state"><div class="icon">⚠️</div>Could not load saved embeds. Check Firebase rules for `embed_studio` and confirm the Realtime Database exists in project datingapplication-25f32.</div>';
            }
        });

        window.deleteEmbed = function(key) {
            if (!confirm('Remove this embed?')) return;
            remove(ref(db, EMBEDS_PATH + '/' + key)).catch(err => {
                showStatus('Delete failed: ' + (err.message || 'unknown'), 'error');
            });
        };

        window.copyCode = function(key) {
            const el = document.getElementById('code-' + key);
            if (!el) return;
            navigator.clipboard.writeText(el.textContent).then(() => {
                showStatus('Embed code copied.', 'success');
            }).catch(() => showStatus('Copy failed. Select the code manually.', 'error'));
        };

        window.copyShareUrl = function(key) {
            const el = document.getElementById('share-' + key);
            if (!el) return;
            const url = el.textContent.trim();
            navigator.clipboard.writeText(url).then(() => {
                showStatus('Share link copied. Send it to yourself or anyone.', 'success');
            }).catch(() => showStatus('Copy failed. Select the link manually.', 'error'));
        };

        window.openLink = function(key) {
            const el = document.getElementById('code-' + key);
            if (!el) return;
            const data = JSON.parse(el.getAttribute('data-raw') || '{}');
            if (data.url) window.open(data.url, '_blank');
        };

        window.openShareUrl = function(key) {
            const el = document.getElementById('share-' + key);
            if (!el) return;
            window.open(el.textContent.trim(), '_blank');
        };

        window.nativeShare = async function(key, title) {
            const el = document.getElementById('share-' + key);
            if (!el) return;
            const url = el.textContent.trim();
            if (navigator.share) {
                try {
                    await navigator.share({ title: title || 'JARVIS Embed', text: 'Embed ready to use', url: url });
                    showStatus('Shared.', 'success');
                } catch (e) {
                    if (e.name !== 'AbortError') showStatus('Share cancelled.', 'error');
                }
            } else {
                window.copyShareUrl(key);
            }
        };

        function renderList(list) {
            const wrap = document.getElementById('embedList');
            if (!list.length) {
                wrap.innerHTML = '<div class="empty-state"><div class="icon">🔗</div>No embeds yet. Paste a link or an HTML block above to get started.</div>';
                return;
            }
            wrap.innerHTML = list.map(item => renderCard(item, item.key, false)).join('');
        }

        function showStatus(msg, type) {
            const box = document.getElementById('statusBox');
            box.textContent = msg;
            box.className = 'status ' + type;
            if (type !== 'error') setTimeout(() => { box.className = 'status'; }, 5000);
        }
    }

    function renderCard(item, key, isSharePage) {
        const shareUrl = item.shareUrl || (window.location.origin + window.location.pathname + '?embed=' + encodeURIComponent(key));
        const actions = isSharePage
            ? `
                <button class="btn" onclick="navigator.clipboard.writeText(document.getElementById('code-${key}').textContent).then(()=>alert('Embed code copied')).catch(()=>alert('Copy failed'))">Copy embed code</button>
                <button class="btn secondary" onclick="window.open('${escapeHtml(item.url)}','_blank')">Open original</button>
            `
            : `
                <button class="btn" onclick="copyCode('${key}')">Copy embed code</button>
                <button class="btn share" onclick="copyShareUrl('${key}')">🔗 Copy share link</button>
                <button class="btn secondary" onclick="nativeShare('${key}', '${escapeHtml(item.title || '')}')">📤 Share</button>
                <button class="btn secondary" onclick="openShareUrl('${key}')">Preview share page</button>
                <button class="btn secondary" onclick="openLink('${key}')">Open original</button>
                <button class="btn danger" onclick="deleteEmbed('${key}')">Remove</button>
            `;

        return `
            <div class="embed-card">
                <div class="embed-header">
                    <div class="embed-title">${escapeHtml(item.title || item.url || 'Untitled')}</div>
                    <div class="embed-type">${escapeHtml((item.type || '').toUpperCase())}</div>
                </div>
                <div class="embed-preview">${renderPreview(item)}</div>
                <div style="font-size:11px;color:#94a3b8;text-transform:uppercase;letter-spacing:1px;font-weight:700;">Share link</div>
                <div class="embed-share-url" id="share-${key}">${escapeHtml(shareUrl)}</div>
                <div style="font-size:11px;color:#94a3b8;text-transform:uppercase;letter-spacing:1px;font-weight:700;">Embed code</div>
                <div class="embed-code" id="code-${key}" data-raw='${escapeJson(item)}'>${escapeHtml(item.embedCode || '')}</div>
                <div class="embed-actions">${actions}</div>
            </div>
        `;
    }

    function renderPreview(item) {
        if (item.type === 'tiktok') {
            return `<div class="unavailable">
                <div class="icon">🎵</div>
                <div>TikTok preview may be blocked in your region.</div>
                <a class="fallback-link" href="${escapeHtml(item.url)}" target="_blank" style="height:auto;padding:8px;font-size:13px;">Open on TikTok →</a>
            </div>`;
        }
        if (item.type === 'html') return item.embedCode;
        if (!item.embedUrl) return `<a class="fallback-link" href="${escapeHtml(item.url)}" target="_blank">${escapeHtml(item.url)}</a>`;
        if (item.type === 'video') return `<video controls src="${escapeHtml(item.embedUrl)}"></video>`;
        if (item.type === 'audio') return `<audio controls src="${escapeHtml(item.embedUrl)}"></audio>`;
        if (item.type === 'image') return `<img src="${escapeHtml(item.embedUrl)}" alt="">`;
        return `<iframe src="${escapeHtml(item.embedUrl)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
    }

    async function validateTikTok(url) {
        try {
            const res = await fetch('https://www.tiktok.com/oembed?url=' + encodeURIComponent(url));
            if (!res.ok) return { ok: false, reason: 'HTTP ' + res.status };
            const data = await res.json();
            if (data && data.html) return { ok: true };
            return { ok: false, reason: 'No embed HTML returned (region-restricted or removed).' };
        } catch (e) {
            return { ok: false, reason: 'Network error: ' + (e.message || 'unknown') };
        }
    }

    function analyzeInput(raw, mode) {
        if (mode === 'code' || /<[a-z]/i.test(raw)) return analyzeHtmlBlock(raw);
        if (!/^https?:\/\//i.test(raw)) return null;
        const url = raw;

        const yt = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/shorts\/|youtube\.com\/live\/)([A-Za-z0-9_-]{11})/);
        if (yt) {
            const id = yt[1];
            return { type: 'youtube', title: 'YouTube · ' + id, url,
                embedUrl: 'https://www.youtube.com/embed/' + id + '?playsinline=1&rel=0',
                embedCode: '<iframe width="100%" height="400" src="https://www.youtube.com/embed/' + id + '?playsinline=1&rel=0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>' };
        }
        const vimeo = url.match(/vimeo\.com\/(?:video\/)?(\d+)/);
        if (vimeo) {
            const id = vimeo[1];
            return { type: 'vimeo', title: 'Vimeo · ' + id, url,
                embedUrl: 'https://player.vimeo.com/video/' + id,
                embedCode: '<iframe width="100%" height="400" src="https://player.vimeo.com/video/' + id + '" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>' };
        }
        const tiktok = url.match(/tiktok\.com\/@[^/]+\/video\/(\d+)/);
        if (tiktok) {
            const id = tiktok[1];
            const embedUrl = 'https://www.tiktok.com/player/v1/' + id + '?embed_from=webapp_share&music_info=1&description=1&autoplay=1&muted=1';
            return { type: 'tiktok', title: 'TikTok · ' + id, url, embedUrl,
                embedCode: '<iframe height="578" width="325" src="' + embedUrl + '" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; fullscreen; gyroscope; picture-in-picture; web-share" allowfullscreen loading="lazy"></iframe>' };
        }
        if (/\.(mp4|webm|ogg|ogv|mov|m4v)(\?|$)/i.test(url)) return { type: 'video', title: 'Video file', url, embedUrl: url, embedCode: '<video controls playsinline src="' + url + '" style="width:100%;"></video>' };
        if (/\.(mp3|wav|ogg|oga|m4a|aac|flac)(\?|$)/i.test(url)) return { type: 'audio', title: 'Audio file', url, embedUrl: url, embedCode: '<audio controls src="' + url + '" style="width:100%;"></audio>' };
        if (/\.(jpg|jpeg|png|gif|webp|bmp|svg)(\?|$)/i.test(url)) return { type: 'image', title: 'Image', url, embedUrl: url, embedCode: '<img src="' + url + '" alt="" style="max-width:100%;">' };
        if (/\.pdf(\?|$)/i.test(url)) return { type: 'pdf', title: 'PDF', url, embedUrl: url, embedCode: '<iframe src="' + url + '" width="100%" height="600" style="border:0;"></iframe>' };

        return { type: 'link', title: 'Link', url, embedUrl: null, embedCode: '<a href="' + url + '" target="_blank" rel="noopener">' + url + '</a>' };
    }

    function analyzeHtmlBlock(raw) {
        const html = raw.trim();
        const iframeMatch = html.match(/<iframe[^>]*\bsrc\s*=\s*["']([^"']+)["']/i);
        const videoMatch = html.match(/<video[^>]*\bsrc\s*=\s*["']([^"']+)["']/i);
        const audioMatch = html.match(/<audio[^>]*\bsrc\s*=\s*["']([^"']+)["']/i);
        const imgMatch = html.match(/<img[^>]*\bsrc\s*=\s*["']([^"']+)["']/i);
        const sourceMatch = html.match(/<source[^>]*\bsrc\s*=\s*["']([^"']+)["']/i);
        const src = (iframeMatch && iframeMatch[1]) || (videoMatch && videoMatch[1]) || (audioMatch && audioMatch[1]) || (imgMatch && imgMatch[1]) || (sourceMatch && sourceMatch[1]);
        if (!src) return null;
        if (!/^https?:\/\//i.test(src)) return null;
        let type = 'html';
        if (/tiktok\.com/i.test(src)) type = 'tiktok';
        else if (/youtube\.com\/embed|youtu\.be/i.test(src)) type = 'youtube';
        else if (/player\.vimeo\.com/i.test(src)) type = 'vimeo';
        else if (iframeMatch) type = 'iframe';
        const titleMatch = html.match(/\btitle\s*=\s*["']([^"']+)["']/i);
        return { type, title: titleMatch ? titleMatch[1] : src, url: src, embedUrl: src, embedCode: html };
    }

    function escapeHtml(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function escapeJson(obj) {
        return escapeHtml(JSON.stringify({ url: obj.url, type: obj.type, title: obj.title })).replace(/'/g, '&#39;');
    }
</script>
