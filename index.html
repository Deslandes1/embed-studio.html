<div class="container" id="appContainer"></div>

<script type="module">
    import { ref, push, onValue, remove, get, set, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const wait = setInterval(() => {
        if (window._fb && window._fb.db) { clearInterval(wait); boot(); }
    }, 100);

    let currentMode = 'url';
    let viewMode = 'editor';
    let shareKey = null;
    let justSavedKey = null;

    const LIKE_STORAGE_KEY = 'jarvis_embed_likes';

    function getLocalUser() {
        let id = localStorage.getItem('jarvis_embed_uid');
        if (!id) {
            id = 'user_' + Math.random().toString(36).slice(2, 10);
            localStorage.setItem('jarvis_embed_uid', id);
        }
        return id;
    }

    function getLocalLikes() {
        try { return JSON.parse(localStorage.getItem(LIKE_STORAGE_KEY) || '{}'); } catch (e) { return {}; }
    }
    function setLocalLike(key, liked) {
        const map = getLocalLikes();
        map[key] = !!liked;
        try { localStorage.setItem(LIKE_STORAGE_KEY, JSON.stringify(map)); } catch (e) {}
    }
    function isLocallyLiked(key) { return !!getLocalLikes()[key]; }

    function boot() {
        const params = new URLSearchParams(window.location.search);
        shareKey = params.get('embed');
        const v = params.get('view');

        if (shareKey) { viewMode = 'share'; renderShareView(); }
        else if (v === 'watch') { viewMode = 'watch'; renderWatchView(); initWatchView(); }
        else { viewMode = 'editor'; renderMainView(); initMainApp(); }
    }

    // ============================================================
    // EDITOR
    // ============================================================
    function renderMainView() {
        document.getElementById('appContainer').innerHTML = `
            <div class="top-bar">
                <h1>JARVIS Embed Studio</h1>
                <div class="actions">
                    <a href="?view=watch" class="btn secondary" style="text-decoration:none;">👁 View Watch Page</a>
                </div>
            </div>
            <p class="subtitle">Paste any link. Tap Convert &amp; Save — it saves, plays, and appears on the Watch Page for all users. Like, comment, and edit below each video.</p>

            <div class="mode-toggle">
                <button id="modeUrl" class="active" onclick="setMode('url')">🔗 Link</button>
                <button id="modeCode" onclick="setMode('code')">&lt;/&gt; HTML code</button>
            </div>

            <div class="input-row" id="rowUrl">
                <input id="urlInput" type="text" placeholder="Paste a YouTube, TikTok, Instagram, X, SoundCloud, MP4, PDF, or any link…">
            </div>
            <div class="input-row" id="rowCode" style="display:none;">
                <textarea id="codeInput" placeholder='Paste a full iframe, video, audio, or img HTML block.'></textarea>
            </div>

            <div class="hint">
                Every embed you save appears instantly on the <a href="?view=watch" style="color:#d4af37;">Watch Page</a> — share that URL with your users so they can watch and interact anytime.
            </div>

            <div class="input-row">
                <button class="btn" id="saveBtn" onclick="addLink()">Convert &amp; Save</button>
            </div>

            <div id="statusBox" class="status"></div>
            <div id="embedList"></div>

            <div class="footer-info">
                Built by Gesner Deslandes (GlobalInternet.py)<br>
                Phone: (509) 4738 5663 · Email: deslandes78@gmail.com<br>
                <a href="https://deslandes1.github.io/jarvis-auto-apply./" target="_blank">JARVIS Auto-Apply</a> ·
                <a href="https://deslandes1.github.io/G-COMMUNICATION-2026/" target="_blank">G JARVIS Portal</a> ·
                <a href="https://globalinternetsitepy-abh7v6tnmskxxnuplrdcgk.streamlit.app/" target="_blank">Global Technology Site</a>
            </div>
        `;
    }

    function initMainApp() {
        const db = window._fb.db;
        const EMBEDS_PATH = 'embed_studio/links';
        const linksRef = ref(db, EMBEDS_PATH);

        window.setMode = function(mode) {
            currentMode = mode;
            document.getElementById('modeUrl').classList.toggle('active', mode === 'url');
            document.getElementById('modeCode').classList.toggle('active', mode === 'code');
            document.getElementById('rowUrl').style.display = mode === 'url' ? 'flex' : 'none';
            document.getElementById('rowCode').style.display = mode === 'code' ? 'flex' : 'none';
        };

        window.addLink = async function() {
            const btn = document.getElementById('saveBtn');
            let raw = currentMode === 'url'
                ? (document.getElementById('urlInput').value || '').trim()
                : (document.getElementById('codeInput').value || '').trim();

            if (!raw) return showStatus('Please paste a link first.', 'error');

            btn.disabled = true;
            btn.textContent = 'Building embed…';

            const info = await analyzeInput(raw, currentMode);

            btn.disabled = false;
            btn.textContent = 'Convert & Save';

            if (!info) {
                showStatus('Could not convert this link. Try pasting the platform embed code instead.', 'error');
                return;
            }

            const newRef = push(linksRef);
            const key = newRef.key;
            const shareUrl = window.location.origin + window.location.pathname + '?embed=' + encodeURIComponent(key);

            newRef.set({
                url: info.url,
                type: info.type,
                embedUrl: info.embedUrl,
                embedCode: info.embedCode,
                title: info.title,
                shareUrl: shareUrl,
                likes: 0,
                comments: 0,
                createdAt: Date.now()
            }).then(() => {
                document.getElementById('urlInput').value = '';
                document.getElementById('codeInput').value = '';

    async function analyzeInput(raw, mode) {
        if (mode === 'code' || /<[a-z]/i.test(raw)) return analyzeHtmlBlock(raw);
        if (!/^https?:\/\//i.test(raw)) return null;
        return await buildEmbed(raw);
    }

    async function buildEmbed(url) {
        if (/\.(mp4|webm|ogg|ogv|mov|m4v)(\?|$)/i.test(url)) return { type: 'video', title: 'Video file', url, embedUrl: url, embedCode: '<video controls playsinline src="' + url + '" style="width:100%;"></video>' };
        if (/\.(mp3|wav|ogg|oga|m4a|aac|flac)(\?|$)/i.test(url)) return { type: 'audio', title: 'Audio file', url, embedUrl: url, embedCode: '<audio controls src="' + url + '" style="width:100%;"></audio>' };
        if (/\.(jpg|jpeg|png|gif|webp|bmp|svg)(\?|$)/i.test(url)) return { type: 'image', title: 'Image', url, embedUrl: url, embedCode: '<img src="' + url + '" style="max-width:100%;">' };
        if (/\.pdf(\?|$)/i.test(url)) return { type: 'pdf', title: 'PDF', url, embedUrl: url, embedCode: '<iframe src="' + url + '" width="100%" height="600" style="border:0;"></iframe>' };

        const ytMatch = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/shorts\/|youtube\.com\/live\/)([A-Za-z0-9_-]{11})/);
        if (ytMatch) {
            const id = ytMatch[1];
            return { type: 'youtube', title: 'YouTube · ' + id, url,
                embedUrl: 'https://www.youtube.com/embed/' + id + '?playsinline=1&rel=0&autoplay=1',
                embedCode: '<iframe width="100%" height="400" src="https://www.youtube.com/embed/' + id + '?playsinline=1&rel=0&autoplay=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>' };
        }
        const vimeoMatch = url.match(/vimeo\.com\/(?:video\/)?(\d+)/);
        if (vimeoMatch) {
            const id = vimeoMatch[1];
            return { type: 'vimeo', title: 'Vimeo · ' + id, url,
                embedUrl: 'https://player.vimeo.com/video/' + id + '?autoplay=1',
                embedCode: '<iframe width="100%" height="400" src="https://player.vimeo.com/video/' + id + '?autoplay=1" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>' };
        }

        const oembed = await tryOEmbed(url);
        if (oembed) return oembed;

        const tiktokMatch = url.match(/tiktok\.com\/@[^/]+\/video\/(\d+)/);
        if (tiktokMatch) {
            const id = tiktokMatch[1];
            const embedUrl = 'https://www.tiktok.com/player/v1/' + id + '?embed_from=webapp_share&music_info=1&description=1&autoplay=1&muted=1';
            return { type: 'tiktok', title: 'TikTok · ' + id, url, embedUrl,
                embedCode: '<iframe height="578" width="325" src="' + embedUrl + '" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; fullscreen; gyroscope; picture-in-picture; web-share" allowfullscreen loading="lazy"></iframe>' };
        }

        return await buildPreviewCard(url);
    }

    async function tryOEmbed(url) {
        const endpoints = [
            'https://www.youtube.com/oembed?format=json&url=',
            'https://vimeo.com/api/oembed.json?url=',
            'https://www.tiktok.com/oembed?url=',
            'https://www.facebook.com/plugins/oembed?url=',
            'https://publish.twitter.com/oembed?url=',
            'https://soundcloud.com/oembed?format=json&url=',
            'https://www.dailymotion.com/services/oembed?format=json&url=',
            'https://www.reddit.com/oembed?url=',
            'https://www.pinterest.com/oembed.json?url='
        ];
        for (const endpoint of endpoints) {
            try {
                const res = await fetch(endpoint + encodeURIComponent(url), { method: 'GET' });
                if (!res.ok) continue;
                const data = await res.json();
                if (data && data.html) {
                    let type = 'iframe';
                    if (/youtube/.test(endpoint)) type = 'youtube';
                    else if (/vimeo/.test(endpoint)) type = 'vimeo';
                    else if (/tiktok/.test(endpoint)) type = 'tiktok';
                    else if (/twitter/.test(endpoint)) type = 'twitter';
                    else if (/facebook/.test(endpoint)) type = 'facebook';
                    else if (/soundcloud/.test(endpoint)) type = 'soundcloud';
                    else if (/dailymotion/.test(endpoint)) type = 'dailymotion';
                    else if (/reddit/.test(endpoint)) type = 'reddit';
                    else if (/pinterest/.test(endpoint)) type = 'pinterest';
                    return {
                        type,
                        title: data.title || data.author_name || url,
                        url,
                        embedUrl: extractIframeSrc(data.html) || url,
                        embedCode: data.html
                    };
                }
            } catch (e) { }
        }
        return null;
    }

    async function buildPreviewCard(url) {
        let domain = '';
        try { domain = new URL(url).hostname.replace(/^www\./, ''); } catch (e) {}
        let title = url;
        try {
            const res = await fetch('https://api.microlink.io/?url=' + encodeURIComponent(url));
            if (res.ok) {
                const data = await res.json();
                if (data && data.data) title = data.data.title || data.data.description || url;
            }
        } catch (e) {}
        const embedCode = `<a href="${url}" target="_blank" rel="noopener" style="display:block;padding:16px;background:#0f172a;border:1px solid #1e293b;border-radius:10px;text-decoration:none;color:#e2e8f0;">
  <div style="font-size:11px;color:#94a3b8;text-transform:uppercase;letter-spacing:1px;font-weight:700;">${escapeHtml(domain)}</div>
  <div style="font-size:15px;font-weight:700;margin-top:6px;">${escapeHtml(title)}</div>
  <div style="font-size:13px;color:#d4af37;margin-top:8px;font-weight:700;">Open original →</div>
</a>`;
        return { type: 'link', title, url, embedUrl: null, embedCode };
    }

    function extractIframeSrc(html) {
        const m = html.match(/<iframe[^>]*\bsrc\s*=\s*["']([^"']+)["']/i);
        return m ? m[1] : null;
    }

    function analyzeHtmlBlock(raw) {
        const html = raw.trim();
        const iframeMatch = html.match(/<iframe[^>]*\bsrc\s*=\s*["']([^"']+)["']/i);
        const videoMatch = html.match(/<video[^>]*\bsrc\s*=\s*["']([^"']+)["']/i);
        const audioMatch = html.match(/<audio[^>]*\bsrc\s*=\s*["']([^"']+)["']/i);
        const imgMatch = html.match(/<img[^>]*\bsrc\s*=\s*["']([^"']+)["']/i);
        const src = (iframeMatch && iframeMatch[1]) || (videoMatch && videoMatch[1]) || (audioMatch && audioMatch[1]) || (imgMatch && imgMatch[1]);
        if (!src) return null;
        let type = 'html';
        if (/tiktok\.com/i.test(src)) type = 'tiktok';
        else if (/youtube\.com\/embed|youtu\.be/i.test(src)) type = 'youtube';
        else if (/player\.vimeo\.com/i.test(src)) type = 'vimeo';
        else if (iframeMatch) type = 'iframe';
        const titleMatch = html.match(/\btitle\s*=\s*["']([^"']+)["']/i);
        return { type, title: titleMatch ? titleMatch[1] : src, url: src, embedUrl: src, embedCode: html };
    }

    function escapeHtml(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function escapeJson(obj) {
        return escapeHtml(JSON.stringify({ url: obj.url, type: obj.type, title: obj.title })).replace(/'/g, '&#39;');
    }
</script>
