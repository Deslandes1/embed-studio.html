<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

        background: #0b2a4a;
        color: #fff;

    .container { max-width: 1100px; margin: 0 auto; }
    h1 {

    .input-row {

    .btn {
        padding: 14px 22px;
        border-radius: 10px;
        border: none;

    .btn.secondary {
        background: #1e293b;

    .status {

    .status.error { background: rgba(255,71,87,0.2); border: 1px solid #ff4757; color: #ff6b7a; display: block; }

    .embed-card {

        width: 100%;
        aspect-ratio: 16 / 9;
        background: #000;
        border-radius: 8px;

    .embed-preview video,

<body>
<div class="container">
    <h1>JARVIS Embed Studio</h1>
    <p class="subtitle">Paste any link. Turn it into an embeddable player. Use it here or anywhere else.</p>

    <div class="input-row">
        <input id="urlInput" type="text" placeholder="Paste a YouTube, Vimeo, MP4, MP3, PDF, or any link…">
        <button class="btn" onclick="addLink()">Convert & Save</button>
    </div>

    <div id="statusBox" class="status"></div>
    <div id="embedList"></div>

    <div class="footer-info">
        Built by Gesner Deslandes (GlobalInternet.py)<br>
        Phone: (509) 4738 5663 · Email: deslandes78@gmail.com<br>
        <a href="https://deslandes1.github.io/jarvis-auto-apply./" target="_blank">JARVIS Auto-Apply</a> ·
        <a href="https://deslandes1.github.io/G-COMMUNICATION-2026/" target="_blank">G JARVIS Portal</a> ·
        <a href="https://globalinternetsitepy-abh7v6tnmskxxnuplrdcgk.streamlit.app/" target="_blank">Global Technology Site</a>
    </div>
</div>

<script type="module">
    import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const wait = setInterval(() => {
        if (window._fb && window._fb.db) {
            clearInterval(wait);
            init();
        }
    }, 100);

    function init() {
        const db = window._fb.db;
        const EMBEDS_PATH = 'embed_studio/links';
        const linksRef = ref(db, EMBEDS_PATH);

        window.addLink = function() {
            const inp = document.getElementById('urlInput');
            const raw = (inp.value || '').trim();
            if (!raw) return showStatus('Please paste a link first.', 'error');
            if (!/^https?:\/\//i.test(raw)) return showStatus('The link must start with http:// or https://', 'error');

            const info = analyzeUrl(raw);
            push(linksRef, {
                url: raw,
                type: info.type,
                embedUrl: info.embedUrl,
                embedCode: info.embedCode,
                title: info.title,
                createdAt: Date.now()
            }).then(() => {
                inp.value = '';
                showStatus('Link converted and saved.', 'success');
            }).catch(err => {
                showStatus('Save failed: ' + (err.message || 'unknown'), 'error');
            });
        };

        onValue(linksRef, (snapshot) => {
            const data = snapshot.val() || {};
            const list = Object.keys(data)
                .map(k => ({ key: k, ...data[k] }))
                .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
            renderList(list);
        });

        window.deleteEmbed = function(key) {
            if (!confirm('Remove this embed?')) return;
            remove(ref(db, EMBEDS_PATH + '/' + key));
        };

        window.copyCode = function(key) {
            const el = document.getElementById('code-' + key);
            if (!el) return;
            navigator.clipboard.writeText(el.textContent).then(() => {
                showStatus('Embed code copied.', 'success');
            }).catch(() => showStatus('Copy failed. Select the code manually.', 'error'));
        };

        window.openLink = function(key) {
            const el = document.getElementById('code-' + key);
            if (!el) return;
            const data = JSON.parse(el.getAttribute('data-raw') || '{}');
            if (data.url) window.open(data.url, '_blank');
        };

        function renderList(list) {
            const wrap = document.getElementById('embedList');
            if (!list.length) {
                wrap.innerHTML = '<div class="empty-state"><div class="icon">🔗</div>No links yet. Paste one above to get started.</div>';
                return;
            }
            wrap.innerHTML = list.map(item => `
                <div class="embed-card">
                    <div class="embed-header">
                        <div class="embed-title">${escapeHtml(item.title || item.url || 'Untitled')}</div>
                        <div class="embed-type">${escapeHtml((item.type || '').toUpperCase())}</div>
                    </div>
                    <div class="embed-preview">${renderPreview(item)}</div>
                    <div class="embed-code" id="code-${item.key}" data-raw='${escapeJson(item)}'>${escapeHtml(item.embedCode || '')}</div>
                    <div class="embed-actions">
                        <button class="btn" onclick="copyCode('${item.key}')">Copy embed code</button>
                        <button class="btn secondary" onclick="openLink('${item.key}')">Open original</button>
                        <button class="btn danger" onclick="deleteEmbed('${item.key}')">Remove</button>
                    </div>
                </div>
            `).join('');
        }

        function renderPreview(item) {
            if (!item.embedUrl) return `<a class="fallback-link" href="${escapeHtml(item.url)}" target="_blank">${escapeHtml(item.url)}</a>`;
            if (item.type === 'video' && /\.(mp4|webm|ogg)(\?|$)/i.test(item.url)) {
                return `<video controls src="${escapeHtml(item.embedUrl)}"></video>`;
            }
            if (item.type === 'audio') {
                return `<audio controls src="${escapeHtml(item.embedUrl)}"></audio>`;
            }
            if (item.type === 'image') {
                return `<img src="${escapeHtml(item.embedUrl)}" alt="">`;
            }
            return `<iframe src="${escapeHtml(item.embedUrl)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
        }

        function showStatus(msg, type) {
            const box = document.getElementById('statusBox');
            box.textContent = msg;
            box.className = 'status ' + type;
            setTimeout(() => { box.className = 'status'; }, 4000);
        }
    }

    function analyzeUrl(raw) {
        let url = raw;
        // YouTube
        const yt = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/shorts\/)([A-Za-z0-9_-]{11})/);
        if (yt) {
            const id = yt[1];
            return {
                type: 'youtube',
                title: 'YouTube video · ' + id,
                embedUrl: 'https://www.youtube.com/embed/' + id + '?playsinline=1&rel=0',
                embedCode: '<iframe width="100%" height="400" src="https://www.youtube.com/embed/' + id + '?playsinline=1&rel=0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>'
            };
        }
        // Vimeo
        const vimeo = url.match(/vimeo\.com\/(?:video\/)?(\d+)/);
        if (vimeo) {
            const id = vimeo[1];
            return {
                type: 'vimeo',
                title: 'Vimeo video · ' + id,
                embedUrl: 'https://player.vimeo.com/video/' + id,
                embedCode: '<iframe width="100%" height="400" src="https://player.vimeo.com/video/' + id + '" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>'
            };
        }
        // Direct video
        if (/\.(mp4|webm|ogg|ogv|mov|m4v)(\?|$)/i.test(url)) {
            return {
                type: 'video',
                title: 'Direct video file',
                embedUrl: url,
                embedCode: '<video controls playsinline src="' + url + '" style="width:100%;"></video>'
            };
        }
        // Direct audio
        if (/\.(mp3|wav|ogg|oga|m4a|aac|flac)(\?|$)/i.test(url)) {
            return {
                type: 'audio',
                title: 'Direct audio file',
                embedUrl: url,
                embedCode: '<audio controls src="' + url + '" style="width:100%;"></audio>'
            };
        }
        // Image
        if (/\.(jpg|jpeg|png|gif|webp|bmp|svg)(\?|$)/i.test(url)) {
            return {
                type: 'image',
                title: 'Image',
                embedUrl: url,
                embedCode: '<img src="' + url + '" alt="" style="max-width:100%;">'
            };
        }
        // PDF
        if (/\.pdf(\?|$)/i.test(url)) {
            return {
                type: 'pdf',
                title: 'PDF document',
                embedUrl: url,
                embedCode: '<iframe src="' + url + '" width="100%" height="600" style="border:0;"></iframe>'
            };
        }
        // Fallback
        return {
            type: 'link',
            title: 'Web link',
            embedUrl: null,
            embedCode: '<a href="' + url + '" target="_blank" rel="noopener">' + url + '</a>'
        };
    }

    function escapeHtml(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function escapeJson(obj) {
        return escapeHtml(JSON.stringify({ url: obj.url, type: obj.type, title: obj.title }))
            .replace(/'/g, '&#39;');
    }
</script>
</body>
</html>
