<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: 'Segoe UI', Roboto, Arial, sans-serif;
        background: #0b2a4a;
        color: #fff;
        min-height: 100vh;
        padding: 20px;

    h1 {
        color: #d4af37;
        text-align: center;
        margin-bottom: 6px;
        font-size: 28px;

    }
    .subtitle {
        text-align: center;
        color: #94a3b8;
        font-size: 14px;

    .input-row {
        display: flex;
        gap: 10px;

    .input-row input,
    .input-row textarea {
        flex: 1;

        padding: 14px 16px;
        border-radius: 10px;

        color: #fff;

        min-height: 110px;

        font-family: monospace;

    }
    .input-row input:focus,
    .input-row textarea:focus { border-color: #d4af37; }
    .btn {
        padding: 14px 22px;
        border-radius: 10px;
        border: none;
        font-weight: 700;
        font-size: 15px;
        cursor: pointer;
        color: #0b2a4a;
        background: linear-gradient(135deg, #f0d369, #d4af37);
        transition: transform 0.15s, box-shadow 0.15s;

    }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(212,175,55,0.4); }
    .btn.secondary { background: #1e293b; color: #e2e8f0; }
    .btn.secondary:hover { box-shadow: 0 4px 14px rgba(30,41,59,0.5); }
    .btn.danger { background: #ff4757; color: #fff; }
    .btn.share { background: #0d7a8c; color: #fff; }
    .mode-toggle {
        display: flex;
        gap: 8px;

    .mode-toggle button {
        background: transparent;
        color: #94a3b8;
        border: none;

        cursor: pointer;

    }
    .mode-toggle button.active {
        background: #d4af37;
        color: #0b2a4a;
    }
    .status {
        padding: 12px 16px;
        border-radius: 8px;
        margin-bottom: 16px;
        font-size: 14px;
        font-weight: 600;
        display: none;
        line-height: 1.5;
    }
    .status.error { background: rgba(255,71,87,0.2); border: 1px solid #ff4757; color: #ff6b7a; display: block; }
    .status.success { background: rgba(74,255,122,0.15); border: 1px solid #4aff7a; color: #8fffa8; display: block; }
    .status.warning { background: rgba(212,175,55,0.15); border: 1px solid #d4af37; color: #f0d369; display: block; }
    .embed-card {
        background: #0f172a;
        border: 1px solid #1e293b;
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }
    .embed-preview {
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #000;
        border-radius: 8px;
        overflow: hidden;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .embed-preview iframe { width: 100%; height: 100%; border: 0; display: block; }
    .embed-preview video { width: 100%; height: 100%; display: block; background: #000; }
    .embed-preview img { max-width: 100%; max-height: 100%; display: block; object-fit: contain; }
    .embed-preview audio { width: 90%; }
    .embed-preview .fallback-link {
        display: flex; align-items: center; justify-content: center;
        height: 100%; color: #d4af37; text-decoration: none;
        font-weight: 700; font-size: 15px; text-align: center;

    .embed-preview .preview-card {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        height: 100%; padding: 20px; gap: 12px; text-align: center;

    }
    .embed-preview .preview-card img { max-width: 80px; max-height: 80px; border-radius: 8px; }
    .embed-preview .preview-card .domain {
        font-size: 12px; color: #94a3b8; text-transform: uppercase;
        letter-spacing: 1px; font-weight: 700;
    }
    .embed-preview .preview-card .title {
        font-size: 15px; font-weight: 700; color: #e2e8f0;

    }

        background: #d4af37; color: #0b2a4a;

        display: flex; justify-content: space-between; align-items: flex-start;
        gap: 10px; flex-wrap: wrap;
    }

    }

        font-size: 11px; font-weight: 800; padding: 4px 10px;
        border-radius: 6px; background: rgba(212,175,55,0.15);
        color: #d4af37; letter-spacing: 0.5px;
    }
    .embed-code {
        background: #000; color: #a5f3fc; padding: 12px;
        border-radius: 8px; font-family: monospace; font-size: 12px;
        white-space: pre-wrap; word-break: break-all;
        border: 1px solid #1e293b; max-height: 160px; overflow: auto;
    }
    .embed-share-url {
        background: #071d33; color: #f0d369; padding: 10px 12px;
        border-radius: 8px; font-family: monospace; font-size: 12px;
        word-break: break-all; border: 1px dashed #d4af37;
    }
    .embed-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .embed-actions .btn { padding: 9px 14px; font-size: 13px; }

        text-align: center; padding: 60px 20px; color: #64748b; font-size: 15px;
    }
    .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
    .footer-info {
        text-align: center; margin-top: 40px; padding-top: 20px;
        border-top: 1px solid #1e293b; font-size: 13px;
        color: #94a3b8; line-height: 1.8;
    }
    .footer-info a { color: #d4af37; text-decoration: none; }
    .hint {
        font-size: 12px; color: #64748b; margin-bottom: 16px;
        line-height: 1.6; padding: 0 4px;
    }
    .share-page .embed-card { max-width: 800px; margin: 0 auto 20px; }
    .share-banner {
        text-align: center; padding: 16px; margin-bottom: 20px;
        background: #071d33; border: 1px solid #d4af37;
        border-radius: 10px; font-size: 14px; color: #f0d369;
    }
</style>

<body>
<div class="container" id="appContainer"></div>

<script type="module">
    import { ref, push, onValue, remove, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const wait = setInterval(() => {
        if (window._fb && window._fb.db) { clearInterval(wait); boot(); }
    }, 100);

    let currentMode = 'url';
    let isShareView = false;
    let shareKey = null;

    function boot() {
        const params = new URLSearchParams(window.location.search);
        shareKey = params.get('embed');
        if (shareKey) { isShareView = true; renderShareView(); }
        else { renderMainView(); initMainApp(); }
    }

    function renderMainView() {
        document.getElementById('appContainer').innerHTML = `
            <h1>JARVIS Embed Studio</h1>
            <p class="subtitle">Paste any link. If the platform supports it, we build the official embed. If not, we build a rich preview card — no redirect tricks.</p>

            <div class="mode-toggle">
                <button id="modeUrl" class="active" onclick="setMode('url')">🔗 Link</button>
                <button id="modeCode" onclick="setMode('code')">&lt;/&gt; HTML code</button>
            </div>

            <div class="input-row" id="rowUrl">
                <input id="urlInput" type="text" placeholder="Paste a YouTube, TikTok, Instagram, X, SoundCloud, MP4, PDF, or any link…">
            </div>
            <div class="input-row" id="rowCode" style="display:none;">
                <textarea id="codeInput" placeholder='Paste a full iframe, video, audio, or img HTML block.'></textarea>
            </div>

            <div class="hint">
                We try the platform's official embed API first. If the platform refuses (like TikTok in some regions), we fall back to a rich link card you can still share.
            </div>

            <div class="input-row">
                <button class="btn" id="saveBtn" onclick="addLink()">Convert &amp; Save</button>
            </div>

            <div id="statusBox" class="status"></div>
            <div id="embedList"></div>

            <div class="footer-info">
                Built by Gesner Deslandes (GlobalInternet.py)<br>
                Phone: (509) 4738 5663 · Email: deslandes78@gmail.com<br>
                <a href="https://deslandes1.github.io/jarvis-auto-apply./" target="_blank">JARVIS Auto-Apply</a> ·
                <a href="https://deslandes1.github.io/G-COMMUNICATION-2026/" target="_blank">G JARVIS Portal</a> ·
                <a href="https://globalinternetsitepy-abh7v6tnmskxxnuplrdcgk.streamlit.app/" target="_blank">Global Technology Site</a>
            </div>
        `;
    }

    function renderShareView() {
        document.getElementById('appContainer').innerHTML = `
            <div class="share-page">
                <h1>Shared Embed</h1>
                <div class="share-banner">This embed was shared with you. It plays right here — no redirect.</div>
                <div id="shareEmbedArea"></div>
                <div style="text-align:center;margin-top:20px;">
                    <a class="btn secondary" href="./" style="text-decoration:none;display:inline-block;">← Back to Embed Studio</a>
                </div>
            </div>
        `;
        loadSharedEmbed(shareKey);
    }

    async function loadSharedEmbed(key) {
        try {
            const snap = await get(ref(window._fb.db, 'embed_studio/links/' + key));
            const item = snap.val();
            const area = document.getElementById('shareEmbedArea');
            if (!item) {
                area.innerHTML = '<div class="empty-state"><div class="icon">🔍</div>This shared embed was not found.</div>';
                return;
            }
            area.innerHTML = renderCard(item, key, true);
        } catch (e) {
            document.getElementById('shareEmbedArea').innerHTML = '<div class="empty-state"><div class="icon">⚠️</div>Could not load this embed.</div>';
        }
    }

    function initMainApp() {
        const db = window._fb.db;
        const EMBEDS_PATH = 'embed_studio/links';
        const linksRef = ref(db, EMBEDS_PATH);

        window.setMode = function(mode) {
            currentMode = mode;
            document.getElementById('modeUrl').classList.toggle('active', mode === 'url');
            document.getElementById('modeCode').classList.toggle('active', mode === 'code');
            document.getElementById('rowUrl').style.display = mode === 'url' ? 'flex' : 'none';
            document.getElementById('rowCode').style.display = mode === 'code' ? 'flex' : 'none';
        };

        window.addLink = async function() {
            const btn = document.getElementById('saveBtn');
            let raw = currentMode === 'url'
                ? (document.getElementById('urlInput').value || '').trim()
                : (document.getElementById('codeInput').value || '').trim();

            if (!raw) return showStatus('Please paste a link first.', 'error');

            btn.disabled = true;
            btn.textContent = 'Building embed…';

            const info = await analyzeInput(raw, currentMode);

            btn.disabled = false;
            btn.textContent = 'Convert & Save';

            if (!info) {
                showStatus('Could not convert this link. Try pasting the platform embed code instead.', 'error');
                return;
            }

            const newRef = push(linksRef);
            const key = newRef.key;
            const shareUrl = window.location.origin + window.location.pathname + '?embed=' + encodeURIComponent(key);

            newRef.set({
                url: info.url,
                type: info.type,
                embedUrl: info.embedUrl,
                embedCode: info.embedCode,
                title: info.title,
                shareUrl: shareUrl,
                createdAt: Date.now()
            }).then(() => {
                document.getElementById('urlInput').value = '';
                document.getElementById('codeInput').value = '';
                showStatus('Saved. Share link ready below.', 'success');
            }).catch(err => {
                const msg = (err && err.message) || 'unknown';
                if (msg.indexOf('PERMISSION_DENIED') !== -1) {
                    showStatus('Firebase denied the write. Confirm `embed_studio` has `.read: true` and `.write: true` under Rules.', 'error');
                } else {
                    showStatus('Save failed: ' + msg, 'error');
                }
            });
        };

        onValue(linksRef, (snapshot) => {
            const data = snapshot.val() || {};
            const list = Object.keys(data)
                .map(k => ({ key: k, ...data[k] }))
                .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
            renderList(list);
        }, (err) => {
            const wrap = document.getElementById('embedList');
            if (wrap && !wrap.innerHTML.trim()) {
                wrap.innerHTML = '<div class="empty-state"><div class="icon">⚠️</div>Could not load saved embeds. Check Firebase rules.</div>';
            }
        });

        window.deleteEmbed = function(key) {
            if (!confirm('Remove this embed?')) return;
            remove(ref(db, EMBEDS_PATH + '/' + key)).catch(err => showStatus('Delete failed: ' + (err.message || 'unknown'), 'error'));
        };

        window.copyCode = function(key) {
            const el = document.getElementById('code-' + key);
            if (!el) return;
            navigator.clipboard.writeText(el.textContent).then(() => showStatus('Embed code copied.', 'success'));
        };

        window.copyShareUrl = function(key) {
            const el = document.getElementById('share-' + key);
            if (!el) return;
            navigator.clipboard.writeText(el.textContent.trim()).then(() => showStatus('Share link copied.', 'success'));
        };

        window.openLink = function(key) {
            const el = document.getElementById('code-' + key);
            if (!el) return;
            const data = JSON.parse(el.getAttribute('data-raw') || '{}');
            if (data.url) window.open(data.url, '_blank');
        };

        window.openShareUrl = function(key) {
            const el = document.getElementById('share-' + key);
            if (!el) return;
            window.open(el.textContent.trim(), '_blank');
        };

        window.nativeShare = async function(key, title) {
            const el = document.getElementById('share-' + key);
            if (!el) return;
            const url = el.textContent.trim();
            if (navigator.share) {
                try { await navigator.share({ title: title || 'JARVIS Embed', text: 'Embed ready to use', url: url }); showStatus('Shared.', 'success'); }
                catch (e) { if (e.name !== 'AbortError') showStatus('Share cancelled.', 'error'); }
            } else { window.copyShareUrl(key); }
        };

        function renderList(list) {
            const wrap = document.getElementById('embedList');
            if (!list.length) {
                wrap.innerHTML = '<div class="empty-state"><div class="icon">🔗</div>No embeds yet. Paste a link above to get started.</div>';
                return;
            }
            wrap.innerHTML = list.map(item => renderCard(item, item.key, false)).join('');
        }

        function showStatus(msg, type) {
            const box = document.getElementById('statusBox');
            box.textContent = msg;
            box.className = 'status ' + type;
            if (type !== 'error') setTimeout(() => { box.className = 'status'; }, 5000);
        }
    }

    function renderCard(item, key, isSharePage) {
        const shareUrl = item.shareUrl || (window.location.origin + window.location.pathname + '?embed=' + encodeURIComponent(key));
        const actions = isSharePage
            ? `<button class="btn" onclick="navigator.clipboard.writeText(document.getElementById('code-${key}').textContent).then(()=>alert('Embed code copied')).catch(()=>alert('Copy failed'))">Copy embed code</button>
               <button class="btn secondary" onclick="window.open('${escapeHtml(item.url)}','_blank')">Open original</button>`
            : `<button class="btn" onclick="copyCode('${key}')">Copy embed code</button>
               <button class="btn share" onclick="copyShareUrl('${key}')">🔗 Copy share link</button>
               <button class="btn secondary" onclick="nativeShare('${key}', '${escapeHtml(item.title || '')}')">📤 Share</button>
               <button class="btn secondary" onclick="openShareUrl('${key}')">Preview share page</button>
               <button class="btn secondary" onclick="openLink('${key}')">Open original</button>
               <button class="btn danger" onclick="deleteEmbed('${key}')">Remove</button>`;

        return `
            <div class="embed-card">
                <div class="embed-header">
                    <div class="embed-title">${escapeHtml(item.title || item.url || 'Untitled')}</div>
                    <div class="embed-type">${escapeHtml((item.type || '').toUpperCase())}</div>
                </div>
                <div class="embed-preview">${renderPreview(item)}</div>
                <div style="font-size:11px;color:#94a3b8;text-transform:uppercase;letter-spacing:1px;font-weight:700;">Share link</div>
                <div class="embed-share-url" id="share-${key}">${escapeHtml(shareUrl)}</div>
                <div style="font-size:11px;color:#94a3b8;text-transform:uppercase;letter-spacing:1px;font-weight:700;">Embed code</div>
                <div class="embed-code" id="code-${key}" data-raw='${escapeJson(item)}'>${escapeHtml(item.embedCode || '')}</div>
                <div class="embed-actions">${actions}</div>
            </div>
        `;
    }

    function renderPreview(item) {
        if (item.type === 'link') {
            const domain = (() => { try { return new URL(item.url).hostname.replace(/^www\./, ''); } catch(e) { return ''; } })();
            const favicon = domain ? 'https://www.google.com/s2/favicons?sz=128&domain=' + domain : '';
            return `<div class="preview-card">
                ${favicon ? `<img src="${favicon}" onerror="this.style.display='none'">` : ''}
                <div class="domain">${escapeHtml(domain)}</div>
                <div class="title">${escapeHtml(item.title || item.url)}</div>
                <a class="open-btn" href="${escapeHtml(item.url)}" target="_blank">Open original</a>
            </div>`;
        }
        if (item.type === 'html') return item.embedCode;
        if (!item.embedUrl) return `<a class="fallback-link" href="${escapeHtml(item.url)}" target="_blank">${escapeHtml(item.url)}</a>`;
        if (item.type === 'video') return `<video controls src="${escapeHtml(item.embedUrl)}"></video>`;
        if (item.type === 'audio') return `<audio controls src="${escapeHtml(item.embedUrl)}"></audio>`;
        if (item.type === 'image') return `<img src="${escapeHtml(item.embedUrl)}" alt="">`;
        return `<iframe src="${escapeHtml(item.embedUrl)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen loading="lazy"></iframe>`;
    }

    async function analyzeInput(raw, mode) {
        if (mode === 'code' || /<[a-z]/i.test(raw)) return analyzeHtmlBlock(raw);
        if (!/^https?:\/\//i.test(raw)) return null;
        return await buildEmbed(raw);
    }

    async function buildEmbed(url) {
        // 1. Direct media
        if (/\.(mp4|webm|ogg|ogv|mov|m4v)(\?|$)/i.test(url)) return { type: 'video', title: 'Video file', url, embedUrl: url, embedCode: '<video controls playsinline src="' + url + '" style="width:100%;"></video>' };
        if (/\.(mp3|wav|ogg|oga|m4a|aac|flac)(\?|$)/i.test(url)) return { type: 'audio', title: 'Audio file', url, embedUrl: url, embedCode: '<audio controls src="' + url + '" style="width:100%;"></audio>' };
        if (/\.(jpg|jpeg|png|gif|webp|bmp|svg)(\?|$)/i.test(url)) return { type: 'image', title: 'Image', url, embedUrl: url, embedCode: '<img src="' + url + '" style="max-width:100%;">' };
        if (/\.pdf(\?|$)/i.test(url)) return { type: 'pdf', title: 'PDF', url, embedUrl: url, embedCode: '<iframe src="' + url + '" width="100%" height="600" style="border:0;"></iframe>' };

        // 2. YouTube via Invidious fallback
        const ytMatch = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/shorts\/|youtube\.com\/live\/)([A-Za-z0-9_-]{11})/);
        if (ytMatch) {
            const id = ytMatch[1];
            return { type: 'youtube', title: 'YouTube · ' + id, url,
                embedUrl: 'https://www.youtube.com/embed/' + id + '?playsinline=1&rel=0',
                embedCode: '<iframe width="100%" height="400" src="https://www.youtube.com/embed/' + id + '?playsinline=1&rel=0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>' };
        }

        // 3. Vimeo
        const vimeoMatch = url.match(/vimeo\.com\/(?:video\/)?(\d+)/);
        if (vimeoMatch) {
            const id = vimeoMatch[1];
            return { type: 'vimeo', title: 'Vimeo · ' + id, url,
                embedUrl: 'https://player.vimeo.com/video/' + id,
                embedCode: '<iframe width="100%" height="400" src="https://player.vimeo.com/video/' + id + '" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>' };
        }

        // 4. Official oEmbed endpoints
        const oembed = await tryOEmbed(url);
        if (oembed) return oembed;

        // 5. TikTok fallback (even if oEmbed fails, still try the player URL)
        const tiktokMatch = url.match(/tiktok\.com\/@[^/]+\/video\/(\d+)/);
        if (tiktokMatch) {
            const id = tiktokMatch[1];
            const embedUrl = 'https://www.tiktok.com/player/v1/' + id + '?embed_from=webapp_share&music_info=1&description=1&autoplay=1&muted=1';
            return { type: 'tiktok', title: 'TikTok · ' + id, url, embedUrl,
                embedCode: '<iframe height="578" width="325" src="' + embedUrl + '" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; fullscreen; gyroscope; picture-in-picture; web-share" allowfullscreen loading="lazy"></iframe>' };
        }

        // 6. Rich preview card fallback
        return await buildPreviewCard(url);
    }

    async function tryOEmbed(url) {
        const endpoints = [
            'https://www.youtube.com/oembed?format=json&url=',
            'https://vimeo.com/api/oembed.json?url=',
            'https://www.tiktok.com/oembed?url=',
            'https://www.facebook.com/plugins/oembed?url=',
            'https://publish.twitter.com/oembed?url=',
            'https://soundcloud.com/oembed?format=json&url=',
            'https://www.dailymotion.com/services/oembed?format=json&url=',
            'https://www.reddit.com/oembed?url=',
            'https://www.pinterest.com/oembed.json?url='
        ];
        // Meta's Instagram requires an access token; skip directly.
        for (const endpoint of endpoints) {
            try {
                const res = await fetch(endpoint + encodeURIComponent(url), { method: 'GET' });
                if (!res.ok) continue;
                const data = await res.json();
                if (data && data.html) {
                    let type = 'iframe';
                    if (/youtube/.test(endpoint)) type = 'youtube';
                    else if (/vimeo/.test(endpoint)) type = 'vimeo';
                    else if (/tiktok/.test(endpoint)) type = 'tiktok';
                    else if (/twitter/.test(endpoint)) type = 'twitter';
                    else if (/facebook/.test(endpoint)) type = 'facebook';
                    else if (/soundcloud/.test(endpoint)) type = 'soundcloud';
                    else if (/dailymotion/.test(endpoint)) type = 'dailymotion';
                    else if (/reddit/.test(endpoint)) type = 'reddit';
                    else if (/pinterest/.test(endpoint)) type = 'pinterest';
                    return {
                        type,
                        title: data.title || data.author_name || url,
                        url,
                        embedUrl: extractIframeSrc(data.html) || url,
                        embedCode: data.html
                    };
                }
            } catch (e) { /* try next endpoint */ }
        }
        return null;
    }

    async function buildPreviewCard(url) {
        let domain = '';
        try { domain = new URL(url).hostname.replace(/^www\./, ''); } catch (e) {}
        let title = url;
        try {
            const res = await fetch('https://api.microlink.io/?url=' + encodeURIComponent(url));
            if (res.ok) {
                const data = await res.json();
                if (data && data.data) {
                    title = data.data.title || data.data.description || url;
                }
            }
        } catch (e) {}
        const embedCode = `<a href="${url}" target="_blank" rel="noopener" style="display:block;padding:16px;background:#0f172a;border:1px solid #1e293b;border-radius:10px;text-decoration:none;color:#e2e8f0;">
  <div style="font-size:11px;color:#94a3b8;text-transform:uppercase;letter-spacing:1px;font-weight:700;">${escapeHtml(domain)}</div>
  <div style="font-size:15px;font-weight:700;margin-top:6px;">${escapeHtml(title)}</div>
  <div style="font-size:13px;color:#d4af37;margin-top:8px;font-weight:700;">Open original →</div>
</a>`;
        return { type: 'link', title, url, embedUrl: null, embedCode };
    }

    function extractIframeSrc(html) {
        const m = html.match(/<iframe[^>]*\bsrc\s*=\s*["']([^"']+)["']/i);
        return m ? m[1] : null;
    }

    function analyzeHtmlBlock(raw) {
        const html = raw.trim();
        const iframeMatch = html.match(/<iframe[^>]*\bsrc\s*=\s*["']([^"']+)["']/i);
        const videoMatch = html.match(/<video[^>]*\bsrc\s*=\s*["']([^"']+)["']/i);
        const audioMatch = html.match(/<audio[^>]*\bsrc\s*=\s*["']([^"']+)["']/i);
        const imgMatch = html.match(/<img[^>]*\bsrc\s*=\s*["']([^"']+)["']/i);
        const src = (iframeMatch && iframeMatch[1]) || (videoMatch && videoMatch[1]) || (audioMatch && audioMatch[1]) || (imgMatch && imgMatch[1]);
        if (!src) return null;
        let type = 'html';
        if (/tiktok\.com/i.test(src)) type = 'tiktok';
        else if (/youtube\.com\/embed|youtu\.be/i.test(src)) type = 'youtube';
        else if (/player\.vimeo\.com/i.test(src)) type = 'vimeo';
        else if (iframeMatch) type = 'iframe';
        const titleMatch = html.match(/\btitle\s*=\s*["']([^"']+)["']/i);
        return { type, title: titleMatch ? titleMatch[1] : src, url: src, embedUrl: src, embedCode: html };
    }

    function escapeHtml(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function escapeJson(obj) {
        return escapeHtml(JSON.stringify({ url: obj.url, type: obj.type, title: obj.title })).replace(/'/g, '&#39;');
    }
</script>
